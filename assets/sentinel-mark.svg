<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Sentinel logo">
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f2ff"/>
      <stop offset="1" stop-color="#00a8ff"/>
    </linearGradient>
    <linearGradient id="cyanDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a36"/>
      <stop offset="1" stop-color="#07121b"/>
    </linearGradient>
  </defs>

  <!-- Outer shield ring -->
  <path d="M128 14l90 34v72c0 60-38 116-90 136-52-20-90-76-90-136V48l90-34z" fill="#0a0e14" stroke="url(#cyan)" stroke-width="10"/>

