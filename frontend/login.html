<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel-LMS | Secure Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #050505;
            --card-bg: rgba(13, 13, 13, 0.9);
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.3);
            --text: #e0e0e0;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- DYNAMIC ANIMATED BACKGROUND --- */
        .bg-glow {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 242, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(157, 80, 187, 0.05) 0%, transparent 40%);
            animation: breathe 15s infinite alternate ease-in-out;
        }

        @keyframes breathe {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* --- LOGIN CARD --- */
        .login-card {
            width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .logo { font-weight: 700; font-size: 1.5rem; letter-spacing: 3px; color: #fff; margin-bottom: 2rem; }
        .logo span { color: var(--accent); }

        /* --- TOGGLE BUTTONS --- */
        .toggle-group {
            display: flex;
            background: #1a1a1a;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .toggle-btn {
            flex: 1;
            padding: 0.6rem;
            border: none;
            background: transparent;
            color: #666;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.3s;
        }

        .toggle-btn.active {
            background: #2a2a2a;
            color: var(--accent);
        }

        /* --- INPUTS --- */
        .input-group { text-align: left; margin-bottom: 1.5rem; }
        .input-group label { 
            display: block; 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            color: #888; 
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            color: #555;
            width: 18px;
        }

        input {
            width: 100%;
            background: #111;
            border: 1px solid var(--border);
            padding: 1rem 1rem 1rem 3rem;
            border-radius: 8px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* --- SUBMIT BUTTON --- */
        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 1rem;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: var(--accent);
            box-shadow: 0 0 25px var(--accent-glow);
            transform: translateY(-2px);
        }

        .footer-text {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #555;
        }

        .footer-text a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="login-card">
        <div class="logo">SENTINEL<span>LMS</span></div>
        
        <div class="toggle-group">
            <button class="toggle-btn active">LOGIN</button>
            <button class="toggle-btn">REGISTER</button>
        </div>

        <form>
            <div class="input-group">
                <label>Access Identifier</label>
                <div class="input-wrapper">
                    <i data-lucide="user"></i>
                    <input type="text" placeholder="Username or Secure Email" required>
                </div>
            </div>

            <div class="input-group">
                <label>Access Key</label>
                <div class="input-wrapper">
                    <i data-lucide="lock"></i>
                    <input type="password" placeholder="••••••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Initialize Session</button>
        </form>

        <p class="footer-text">
            By accessing, you agree to the <a href="#">Operating Protocols</a>
        </p>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
