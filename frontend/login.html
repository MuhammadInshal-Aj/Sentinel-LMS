<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel-LMS | Secure Access</title>
    <link rel="icon" type="image/svg+xml" href="../assets/sentinel-mark.svg">
    <link rel="shortcut icon" href="../assets/sentinel-mark.svg">
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="api.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Shared Stylesheets -->
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/utilities.css">
    <link rel="stylesheet" href="styles/auth.css">
    <script src="toast.js"></script>

    <!-- Login-specific: only body height lock -->
    <style>
        body { height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
    <div class="cyber-bg"><div class="grid"></div><div class="blob blob-1"></div></div>

    <nav class="auth-nav">
        <div class="logo" onclick="location.href='landing.html'">
            <img class="logo-mark" src="../assets/sentinel-mark.svg" alt="Sentinel LMS logo">
            SENTINEL<span>LMS</span>
        </div>
        <div class="nav-dot" title="Home" onclick="location.href='landing.html'"><i data-lucide="home" size="16"></i></div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="card-nav">
                <div class="nav-dot" onclick="window.history.back()" title="Go Back"><i data-lucide="chevron-left" size="18"></i></div>
                <div class="nav-dot" onclick="window.history.forward()" title="Go Forward"><i data-lucide="chevron-right" size="18"></i></div>
            </div>

            <div class="auth-header">
                <h2>SYSTEM ACCESS</h2>
            </div>
            
            <form id="loginForm">
                <div class="auth-input-group">
                    <label>Identifier</label>
                    <div class="auth-field">
                        <i data-lucide="user" size="16"></i>
                        <input type="text" name="identifier" id="loginIdentifier" placeholder="name@domain.com" required>
                    </div>
                </div>
                <div class="auth-input-group">
                    <label>Security Key</label>
                    <div class="auth-field">
                        <i data-lucide="lock" size="16"></i>
                        <input type="password" name="password" id="loginPassword" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-auth" id="submitBtn">
                    <span id="btnText">AUTHORIZE</span>
                    <div class="spinner hidden" id="spinner"></div>
                </button>
            </form>
            <p class="auth-footer">Need clearance? <a href="register.html">Create an account</a></p>
        </div>
    </div>

<script>
    lucide.createIcons();

    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    
    // Get all input fields so we can disable them during login
    const emailInput = document.getElementById('loginIdentifier');
    const passwordInput = document.getElementById('loginPassword');

    // Prevent forward navigation to index.html without proper login
    window.history.replaceState(null, '', window.location.href);

    function updateSystemStatus(message, isSuccess) {
        if (isSuccess) {
            Toast.success(message, 3500);
        } else {
            Toast.error(message, 3500);
        }
        
        // Keep status box for backward compatibility with CSS styling
        // statusBox.textContent = `> ${message}`;
        // statusBox.className = `status-box ${isSuccess ? 'success' : 'error'}`;
        // statusBox.classList.remove('hidden');
    }

    // ===== Show loading state =====
    function setLoadingState(isLoading) {
        if (isLoading) {
            // Disable everything
            submitBtn.disabled = true;
            emailInput.disabled = true;
            passwordInput.disabled = true;
            
            // Show spinner and change text
            btnText.textContent = "AUTHENTICATING";
            spinner.classList.remove('hidden');
            submitBtn.classList.add('loading');
        } else {
            // Re-enable everything
            submitBtn.disabled = false;
            emailInput.disabled = false;
            passwordInput.disabled = false;
            
            // Hide spinner and restore text
            btnText.textContent = "AUTHORIZE";
            spinner.classList.add('hidden');
            submitBtn.classList.remove('loading');
        }
    }

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        // ===== ACTIVATE LOADING STATE =====
        setLoadingState(true);

        // Collect Data
        const email = emailInput.value;
        const password = passwordInput.value;

        try {
            const result = await Api.login(email, password);

            // Save session for future clearance
            Auth.setAuth(result.session.access_token, result.user, result.session.refresh_token || null);

            updateSystemStatus("ACCESS GRANTED. WELCOME BACK, AGENT.", true);
            
            // Replace history state to prevent going back to login.html
            window.history.replaceState({authenticated: true}, '', window.location.href);
            
            // Keep loading state active during redirect
            setTimeout(() => {
                // Use location.replace to clear browser history and prevent back navigation
                window.location.replace('index.html');
            }, 1500);
        } catch (err) {
            setLoadingState(false);
            console.error('Login error:', err);
            if (err instanceof TypeError) {
                updateSystemStatus("ERROR: Cannot reach server. Is it running?", false);
            } else {
                updateSystemStatus(`AUTHORIZATION FAILED: ${err.message}`, false);
            }
            btnText.textContent = "RETRY ACCESS";
        }
    });
</script>
</body>
</html>
