<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel-LMS | Secure Access</title>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Shared Stylesheets -->
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/auth.css">

    <!-- Login-specific: only body height lock -->
    <style>
        body { height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
    <div class="cyber-bg"><div class="grid"></div><div class="blob blob-1"></div></div>

    <nav class="auth-nav">
        <div class="logo" onclick="location.href='landing.html'">SENTINEL<span>LMS</span></div>
        <div class="nav-dot" title="Home" onclick="location.href='landing.html'"><i data-lucide="home" size="16"></i></div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="card-nav">
                <div class="nav-dot" onclick="window.history.back()" title="Go Back"><i data-lucide="chevron-left" size="18"></i></div>
                <div class="nav-dot" onclick="window.history.forward()" title="Go Forward"><i data-lucide="chevron-right" size="18"></i></div>
            </div>

            <div class="auth-header">
                <h2>SYSTEM ACCESS</h2>
            </div>
            
            <form id="loginForm">
                <div class="auth-input-group">
                    <label>Identifier</label>
                    <div class="auth-field">
                        <i data-lucide="user" size="16"></i>
                        <input type="text" name="identifier" id="loginIdentifier" placeholder="Username or Email" required>
                    </div>
                </div>
                <div class="auth-input-group">
                    <label>Security Key</label>
                    <div class="auth-field">
                        <i data-lucide="lock" size="16"></i>
                        <input type="password" name="password" id="loginPassword" placeholder="••••••••" required>
                    </div>
                </div>
                <div id="statusMessage" class="status-box hidden"></div>

                <button type="submit" class="btn-auth" id="submitBtn">
                    <span id="btnText">AUTHORIZE</span>
                    <div class="spinner hidden" id="spinner"></div>
                </button>
            </form>
            <p class="auth-footer">Need clearance? <a href="register.html">Create an account</a></p>
        </div>
    </div>

<!-- Import the config file -->
<script src="config.js"></script>

<script>
    lucide.createIcons();

    const loginForm = document.getElementById('loginForm');
    const statusBox = document.getElementById('statusMessage');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    
    // Get all input fields so we can disable them during login
    const emailInput = document.getElementById('loginIdentifier');
    const passwordInput = document.getElementById('loginPassword');

    function updateSystemStatus(message, isSuccess) {
        statusBox.textContent = `> ${message}`;
        statusBox.className = `status-box ${isSuccess ? 'success' : 'error'}`;
        statusBox.classList.remove('hidden');
    }

    // ===== Show loading state =====
    function setLoadingState(isLoading) {
        if (isLoading) {
            // Disable everything
            submitBtn.disabled = true;
            emailInput.disabled = true;
            passwordInput.disabled = true;
            
            // Show spinner and change text
            btnText.textContent = "AUTHENTICATING";
            spinner.classList.remove('hidden');
            submitBtn.classList.add('loading');
        } else {
            // Re-enable everything
            submitBtn.disabled = false;
            emailInput.disabled = false;
            passwordInput.disabled = false;
            
            // Hide spinner and restore text
            btnText.textContent = "AUTHORIZE";
            spinner.classList.add('hidden');
            submitBtn.classList.remove('loading');
        }
    }

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        // ===== ACTIVATE LOADING STATE =====
        setLoadingState(true);

        // Collect Data
        const email = emailInput.value;
        const password = passwordInput.value;

        try {
            // Use the API_URL from config.js instead of hardcoded localhost
            const response = await fetch(`${API_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const result = await response.json();

            if (response.ok) {
                // Save session for future clearance
                localStorage.setItem('sentinel_token', result.session.access_token);
                if (result.session.refresh_token) {
                    localStorage.setItem('sentinel_refresh_token', result.session.refresh_token);
                }
                
                updateSystemStatus("ACCESS GRANTED. WELCOME BACK, AGENT.", true);
                
                // Keep loading state active during redirect
                // Don't call setLoadingState(false) here - we're leaving the page
                
                // Redirect after 1.5 seconds
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                // ===== STOP LOADING - Show error =====
                setLoadingState(false);
                updateSystemStatus(`AUTHORIZATION FAILED: ${result.error}`, false);
                btnText.textContent = "RETRY ACCESS";
            }
        } catch (err) {
            // ===== STOP LOADING - Show error =====
            setLoadingState(false);
            console.error('Login error:', err); // Log for debugging
            updateSystemStatus("ERROR: Cannot reach server. Is it running?", false);
        }
    });
</script>
</body>
</html>
