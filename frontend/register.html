<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel-LMS | Enlistment</title>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Shared Stylesheets -->
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/auth.css">

    <!-- Register-specific overrides -->
    <style>
        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Register header: slightly larger title */
        .auth-header h2 { font-size: 1.4rem; }
    </style>
</head>
<body>

    <div class="cyber-bg">
        <div class="grid"></div>
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <nav class="auth-nav">
        <a href="landing.html" class="logo">SENTINEL<span>LMS</span></a>
        <ul class="nav-links">
            <li><a href="landing.html">Home</a></li>
            <li><a href="#">Tracks</a></li>
            <li><a href="#">Support</a></li>
        </ul>
        <button class="btn-auth" style="margin: 0; width: auto; padding: 0.6rem 1.5rem; font-size: 0.75rem;" onclick="location.href='login.html'">LOGIN</button>
    </nav>

    <div class="auth-container">
        <div class="auth-card wide">
            
            <div class="card-nav">
                <div class="nav-dot" onclick="window.history.back()" title="Go Back">
                    <i data-lucide="chevron-left" size="18"></i>
                </div>
                <div class="nav-dot" onclick="window.history.forward()" title="Go Forward">
                    <i data-lucide="chevron-right" size="18"></i>
                </div>
            </div>

            <div class="auth-header">
                <h2>New Enlistment</h2>
                <p>Create your secure profile to begin training</p>
            </div>

            <form id="registerForm">
                <div class="auth-name-row">
                    <div class="auth-input-group">
                        <label>First Name</label>
                        <div class="auth-field">
                            <i data-lucide="user" size="18"></i>
                            <input type="text" name="firstName" id="firstName" placeholder="First name" required>
                        </div>
                    </div>

                    <div class="auth-input-group">
                        <label>Last Name</label>
                        <div class="auth-field">
                            <i data-lucide="user-check" size="18"></i>
                            <input type="text" name="lastName" id="lastName" placeholder="Last name" required>
                        </div>
                    </div>
                </div>

                <div class="auth-input-group">
                    <label>Terminal Email</label>
                    <div class="auth-field">
                        <i data-lucide="mail" size="18"></i>
                        <input type="email" name="email" id="regEmail" placeholder="agent@sentinel-lms.io" required>
                    </div>
                </div>

                <div class="auth-input-group">
                    <label>Establish Access Key</label>
                    <div class="auth-field">
                        <i data-lucide="shield-check" size="18"></i>
                        <input type="password" name="password" id="regPassword" placeholder="Min. 8 characters" required>
                    </div>
                </div>

                <div id="statusMessage" class="status-box hidden"></div>

                <button type="submit" class="btn-auth" id="registerBtn">
                    <span id="btnText">Request Clearance</span>
                    <div class="spinner hidden" id="spinner"></div>
                </button>
            </form>

            <p class="auth-footer">
                Already have access? <a href="login.html">Sign in here</a>
            </p>
        </div>
    </div>

<script src="config.js"></script>

<script>
    lucide.createIcons();

    const registerForm = document.getElementById('registerForm');
    const statusBox = document.getElementById('statusMessage');
    const submitBtn = document.getElementById('registerBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');

    const firstNameInput = document.getElementById('firstName');
    const lastNameInput = document.getElementById('lastName');
    const emailInput = document.getElementById('regEmail');
    const passwordInput = document.getElementById('regPassword');

    function updateSystemStatus(message, isSuccess) {
        statusBox.textContent = `> ${message}`;
        statusBox.className = `status-box ${isSuccess ? 'success' : 'error'}`;
        statusBox.classList.remove('hidden');
    }

    function setLoadingState(isLoading) {
        submitBtn.disabled = isLoading;
        firstNameInput.disabled = isLoading;
        lastNameInput.disabled = isLoading;
        emailInput.disabled = isLoading;
        passwordInput.disabled = isLoading;

        if (isLoading) {
            btnText.textContent = "VERIFYING IDENTITY";
            spinner.classList.remove('hidden');
            submitBtn.classList.add('loading');
        } else {
            btnText.textContent = "Request Clearance";
            spinner.classList.add('hidden');
            submitBtn.classList.remove('loading');
        }
    }

    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        statusBox.classList.add('hidden');

        setLoadingState(true);

        const firstName = firstNameInput.value.trim();
        const lastName = lastNameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        try {
            const response = await fetch(`${API_URL}/api/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    first_name: firstName,
                    last_name: lastName,
                    email, 
                    password 
                })
            });

            const result = await response.json();

            if (response.ok) {
                updateSystemStatus("ENLISTMENT SUCCESSFUL. INITIALIZING CLEARANCE...", true);
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                setLoadingState(false);
                updateSystemStatus(`ACCESS DENIED: ${result.error}`, false);
                btnText.textContent = "RETRY ENLISTMENT";
            }
        } catch (err) {
            setLoadingState(false);
            updateSystemStatus("CRITICAL: SENTINEL SERVER OFFLINE", false);
        }
    });
</script>

</body>
</html>
